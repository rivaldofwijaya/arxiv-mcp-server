name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # These three are advisory for now: the code predates this tool config and
      # does not yet pass it. Drop `continue-on-error` once the formatting and
      # typing debt is cleared, so the job starts gating merges.
      - name: Ruff
        continue-on-error: true
        run: ruff check src tests scripts
      - name: Black
        continue-on-error: true
        run: black --check src tests scripts
      - name: Mypy
        continue-on-error: true
        run: mypy src

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Import smoke test
        run: python -c "import arxiv_mcp; print(arxiv_mcp.__version__)"
      # The suite calls the live arXiv API, which rate-limits and can be flaky
      # from CI runners, so a failure here is reported but does not fail the job.
      - name: Integration tests (live arXiv API)
        continue-on-error: true
        run: python tests/test_server_local.py

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check metadata
        run: |
          pip install twine
          twine check dist/*
