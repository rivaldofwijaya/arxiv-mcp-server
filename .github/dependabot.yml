version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/dev/scripts"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: ["dependencies", "tooling"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies", "ci"]
