name: Feature request
description: Suggest a new tool or an improvement to an existing one
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case rather than the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: If this is a new tool, sketch its name, inputs, and output.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: api-support
    attributes:
      label: arXiv API support
      options:
        - label: The arXiv API can supply the data this feature needs
